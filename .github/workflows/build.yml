name: build

on:
  push:
    branches: [main]
    paths:
      - "Surge/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Clash rules from Surge lists
        run: python3 build.py

      - name: Commit generated rules
        run: |
          if git diff --quiet -- Clash/; then
            echo "Clash/ already up to date, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash/
          git commit -m "chore: regenerate Clash rules from Surge [skip ci]"
          git push
